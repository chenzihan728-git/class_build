version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 16
    commands:
      - echo Installing dependencies
      - npm install

  pre_build:
    commands:
      - echo Nothing to do
      - ls -l

  build:
    commands:
      - echo Build started on `date`
      - npm run build

  post_build:
    commands:
      - ls -l
      - echo Build completed on `date`

artifacts:
  files:
    - dist/shop/*
    - dist/shop/assets/*